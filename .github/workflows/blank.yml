name: AnDos PC VIRTUAL

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Instance"
        required: true
        default: "1"

jobs:
  deploy:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360

    steps:

      - name: Configure Windows
        shell: pwsh
        run: |
          Write-Host "Configurando Windows..."

          $advanced = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"

          New-Item $advanced -Force | Out-Null

          Set-ItemProperty `
            $advanced `
            TaskbarAl `
            0 `
            -ErrorAction SilentlyContinue

          Write-Host "Windows configurado."

      - name: Enable RDP
        shell: pwsh
        run: |
          Write-Host "Ativando RDP..."

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP ativado."

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Configure o Secret RDP_PASSWORD no GitHub."
          }

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "runneradmin" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name "runneradmin" `
              -Password $password `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }
          else {
            Set-LocalUser `
              -Name "runneradmin" `
              -Password $password
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "runneradmin" `
            -ErrorAction SilentlyContinue

          Write-Host "Usuário RDP configurado."

      - name: Install Tailscale
        shell: pwsh
        run: |
          Write-Host "Instalando Tailscale..."

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Tailscale instalado."

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Configure o Secret TAILSCALE_AUTH_KEY no GitHub."
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw "tailscale.exe não foi encontrado."
          }

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="andos-${{ github.run_id }}"

          Start-Sleep -Seconds 10

          $ip = (
            & $tailscale ip -4 |
            Select-Object -First 1
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Não foi possível obter o IP Tailscale."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "======================================"
          Write-Host "       AnDos PC VIRTUAL"
          Write-Host "======================================"
          Write-Host "IP Tailscale: $ip"
          Write-Host "Usuário:      runneradmin"
          Write-Host "Porta RDP:    3389"
          Write-Host "======================================"

      - name: Install Luanti
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "       INSTALANDO LUANTI"
          Write-Host "======================================"

          $url = "https://github.com/luanti-org/luanti/releases/download/5.17.0/luanti-5.17.0-win64.zip"
          $zip = "$env:TEMP\luanti.zip"
          $installDir = "C:\Luanti"

          Write-Host "Baixando Luanti..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip `
            -UseBasicParsing

          if (!(Test-Path $zip)) {
            throw "Não foi possível baixar o Luanti."
          }

          Write-Host "Extraindo arquivos..."

          if (Test-Path $installDir) {
            Remove-Item `
              $installDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $installDir `
            -Force | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $installDir `
            -Force

          Remove-Item `
            $zip `
            -Force `
            -ErrorAction SilentlyContinue

          $luanti = Get-ChildItem `
            $installDir `
            -Filter "luanti.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName

          if ([string]::IsNullOrWhiteSpace($luanti)) {
            throw "luanti.exe não foi encontrado depois da extração."
          }

          "LUANTI_EXE=$luanti" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Luanti instalado com sucesso!"
          Write-Host "Executável: $luanti"

      - name: Create Luanti Desktop Shortcut
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LUANTI_EXE)) {
            throw "LUANTI_EXE não foi definido."
          }

          $desktop = [Environment]::GetFolderPath("Desktop")
          $shortcutPath = Join-Path $desktop "Luanti.lnk"

          $shell = New-Object -ComObject WScript.Shell

          $shortcut = $shell.CreateShortcut($shortcutPath)
          $shortcut.TargetPath = $env:LUANTI_EXE
          $shortcut.WorkingDirectory = Split-Path $env:LUANTI_EXE
          $shortcut.Description = "Luanti"
          $shortcut.Save()

          Write-Host "Atalho criado na Área de Trabalho."

      - name: Test RDP
        shell: pwsh
        run: |
          $result = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if ($result.TcpTestSucceeded) {
            Write-Host "RDP está funcionando."
          }
          else {
            Write-Host "AVISO: porta RDP ainda não respondeu."
          }

      - name: Connection Information
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       AN DOS PC VIRTUAL ONLINE"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "RDP"
          Write-Host "------------------------------------------"
          Write-Host "IP:       $env:TAILSCALE_IP"
          Write-Host "Porta:    3389"
          Write-Host "Usuário:  runneradmin"
          Write-Host ""
          Write-Host "JOGO"
          Write-Host "------------------------------------------"
          Write-Host "Luanti instalado"
          Write-Host "Atalho disponível na Área de Trabalho"
          Write-Host ""
          Write-Host "=========================================="

      - name: Keep Alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "================================"
          Write-Host "     AnDos PC VIRTUAL ATIVO"
          Write-Host "================================"
          Write-Host "RDP:       ATIVO"
          Write-Host "Tailscale: ATIVO"
          Write-Host "Luanti:    INSTALADO"
          Write-Host "================================"
          Write-Host ""

          while ($true) {
            Write-Host "PC ativo - $(Get-Date)"
            Start-Sleep -Seconds 60
          }
