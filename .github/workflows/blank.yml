      - name: Windows 10 Style
        shell: pwsh
        run: |

          Write-Host "Aplicando visual estilo Windows 10..."

          # ==========================================
          # MENU INICIAR À ESQUERDA
          # ==========================================

          $advanced = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"

          New-Item `
            $advanced `
            -Force |
            Out-Null

          Set-ItemProperty `
            $advanced `
            TaskbarAl `
            0 `
            -ErrorAction SilentlyContinue


          # ==========================================
          # MOSTRAR EXTENSÕES DOS ARQUIVOS
          # ==========================================

          Set-ItemProperty `
            $advanced `
            HideFileExt `
            0 `
            -ErrorAction SilentlyContinue


          # ==========================================
          # MOSTRAR ARQUIVOS OCULTOS
          # ==========================================

          Set-ItemProperty `
            $advanced `
            Hidden `
            1 `
            -ErrorAction SilentlyContinue


          # ==========================================
          # TEMA ESCURO DO WINDOWS
          # ==========================================

          $personalize = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item `
            $personalize `
            -Force |
            Out-Null

          Set-ItemProperty `
            $personalize `
            AppsUseLightTheme `
            0 `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            $personalize `
            SystemUsesLightTheme `
            0 `
            -ErrorAction SilentlyContinue


          # ==========================================
          # DEIXAR A BARRA DE TAREFAS MENOS TRANSPARENTE
          # ==========================================

          $explorer = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"

          Set-ItemProperty `
            $explorer `
            TaskbarAcrylicOpacity `
            0 `
            -ErrorAction SilentlyContinue


          # ==========================================
          # MOSTRAR ÍCONE "ESTE COMPUTADOR"
          # ==========================================

          $desktop = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel"

          New-Item `
            $desktop `
            -Force |
            Out-Null

          # Este Computador
          Set-ItemProperty `
            $desktop `
            "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" `
            0 `
            -ErrorAction SilentlyContinue


          # ==========================================
          # ATUALIZAR EXPLORER
          # ==========================================

          Stop-Process `
            -Name explorer `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          Start-Process explorer.exe

          Write-Host "Visual aplicado."
