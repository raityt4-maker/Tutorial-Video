    - name: AnDos PlayStation
      shell: pwsh
      run: |
        Write-Host "=== INSTALLING ANDOS PLAYSTATION ===" -ForegroundColor Cyan

        $menuDir = "C:\AnDos"
        New-Item -ItemType Directory -Path $menuDir -Force | Out-Null

        $html = @'
        <!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>AnDos PlayStation</title>
        <style>
        *{box-sizing:border-box}
        body{
          margin:0;color:white;font-family:Arial,sans-serif;
          background:radial-gradient(ellipse at 70% 15%,
          #2462b3,#102b5d 48%,#061329);
          min-height:100vh;padding:35px 5%;
        }
        header{display:flex;justify-content:space-between;align-items:center}
        .logo{font-size:25px;font-weight:bold;letter-spacing:2px}
        .logo span{color:#70baff}
        h1{font-size:38px;font-weight:400;margin:55px 0 8px}
        p{color:#c4d8f5}
        nav{display:flex;gap:25px;margin:35px 0 28px;
          border-bottom:1px solid #ffffff40;padding-bottom:15px}
        nav button{background:none;border:0;color:#bdd2ef;
          font-size:16px;cursor:pointer}
        nav button:hover{color:white}
        .games{display:grid;grid-template-columns:
          repeat(auto-fit,minmax(160px,1fr));gap:18px}
        .game{background:#ffffff12;border:2px solid transparent;
          border-radius:14px;overflow:hidden;cursor:pointer}
        .game:hover{border-color:#70baff;transform:translateY(-3px)}
        .cover{height:145px;display:grid;place-items:center;
          font-size:48px;background:linear-gradient(135deg,#2169b8,#111d46)}
        .game:nth-child(2) .cover{background:linear-gradient(135deg,#7242a5,#28265c)}
        .game:nth-child(3) .cover{background:linear-gradient(135deg,#16878b,#163454)}
        .game:nth-child(4) .cover{background:linear-gradient(135deg,#9b5c31,#45305d)}
        .info{padding:14px}
        .info small{display:block;color:#b8cde9;margin-top:6px}
        .panel{margin-top:30px;padding:20px;background:#ffffff12;
          border:1px solid #ffffff30;border-radius:14px}
        .panel button{background:#2877c9;color:white;border:0;
          border-radius:9px;padding:13px 22px;cursor:pointer}
        .page{display:none}
        .page.active{display:block}
        </style>
        </head>
        <body>
        <header>
          <div class="logo">AnDos <span>PLAY</span></div>
          <div id="clock">00:00</div>
        </header>

        <h1>Bem-vindo de volta!</h1>
        <p>Seu espaço de jogos está pronto.</p>

        <nav>
          <button onclick="page('home')">Início</button>
          <button onclick="page('library')">Biblioteca</button>
          <button onclick="page('apps')">Aplicativos</button>
          <button onclick="page('settings')">Configurações</button>
        </nav>

        <section id="home" class="page active">
          <h2>Seus jogos</h2>
          <div class="games">
            <div class="game" onclick="openGame('Roblox','https://www.roblox.com/')">
              <div class="cover">🎮</div>
              <div class="info"><b>Roblox</b><small>Jogar online</small></div>
            </div>
            <div class="game" onclick="openGame('Minecraft','https://www.minecraft.net/')">
              <div class="cover">🧱</div>
              <div class="info"><b>Minecraft</b><small>Site oficial</small></div>
            </div>
            <div class="game" onclick="openGame('Fortnite','https://www.fortnite.com/')">
              <div class="cover">⚔️</div>
              <div class="info"><b>Fortnite</b><small>Site oficial</small></div>
            </div>
            <div class="game" onclick="openGame('Steam','https://store.steampowered.com/')">
              <div class="cover">🚀</div>
              <div class="info"><b>Steam</b><small>Loja de jogos</small></div>
            </div>
          </div>
          <div class="panel">
            <h2 id="chosen">Selecione um jogo</h2>
            <p id="description">Clique em um cartão para abrir.</p>
            <button onclick="launch()">ABRIR JOGO</button>
          </div>
        </section>

        <section id="library" class="page">
          <h2>Biblioteca</h2>
          <p>Selecione um jogo na tela inicial.</p>
        </section>

        <section id="apps" class="page">
          <h2>Aplicativos</h2>
          <div class="games">
            <div class="game" onclick="openGame('YouTube','https://youtube.com/')">
              <div class="cover">▶️</div>
              <div class="info"><b>YouTube</b><small>Vídeos</small></div>
            </div>
            <div class="game" onclick="openGame('Discord','https://discord.com/app')">
              <div class="cover">💬</div>
              <div class="info"><b>Discord</b><small>Comunidade</small></div>
            </div>
          </div>
        </section>

        <section id="settings" class="page">
          <h2>Configurações</h2>
          <div class="panel">
            <p>Sistema: AnDos Play</p>
            <p>Ambiente: Windows virtual</p>
            <p>Status: Online</p>
            <button onclick="document.documentElement.requestFullscreen()">
              TELA CHEIA
            </button>
          </div>
        </section>

        <script>
        let chosenUrl="";
        function page(id){
          document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
          document.getElementById(id).classList.add('active');
        }
        function openGame(name,url){
          chosenUrl=url;
          document.getElementById('chosen').textContent=name;
          document.getElementById('description').textContent='Selecionado: '+name;
        }
        function launch(){
          if(chosenUrl) window.open(chosenUrl,'_blank');
          else alert('Selecione um jogo primeiro!');
        }
        function clock(){
          document.getElementById('clock').textContent=
            new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        }
        clock();setInterval(clock,1000);
        </script>
        </body>
        </html>
        '@

        $htmlPath = Join-Path $menuDir "index.html"
        Set-Content -Path $htmlPath -Value $html -Encoding UTF8

        $startup = "C:\Users\runneradmin\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
        New-Item -ItemType Directory -Path $startup -Force | Out-Null

        $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
        if (-not (Test-Path $chrome)) {
          $chrome = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
        }
        if (-not (Test-Path $chrome)) {
          throw "Google Chrome não encontrado."
        }

        $launcher = Join-Path $menuDir "start-menu.cmd"
        @"
        @echo off
        start "" "$chrome" --kiosk "file:///C:/AnDos/index.html"
        "@ | Set-Content -Path $launcher -Encoding ASCII

        $shortcut = Join-Path $startup "AnDos PlayStation.cmd"
        Copy-Item $launcher $shortcut -Force

        Write-Host "Menu criado em $htmlPath" -ForegroundColor Green
        Write-Host "Inicialização configurada para runneradmin." -ForegroundColor Green
        
